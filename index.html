<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miramay Home Buyers — Get a Fair Cash Offer in 24 Hours</title>
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="landing.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="LpTop.jsx"></script>
<script type="text/babel" src="LpMid.jsx"></script>
<script type="text/babel" src="LpBottom.jsx"></script>
<script type="text/babel">
  const { useEffect } = React;

  function App() {
    const scrollToForm = () => {
      const el = document.getElementById('cash-offer-form');
      if (!el) return;
      const y = el.getBoundingClientRect().top + window.pageYOffset - 16;
      window.scrollTo({ top: y, behavior: 'smooth' });
    };

    useEffect(() => {
      const interval = setInterval(() => {
        if (window.lucide) window.lucide.createIcons();
      }, 100);
      return () => clearInterval(interval);
    }, []);

    return (
      <div>
        <LpNav onCta={scrollToForm} />
        <LpHero onCta={scrollToForm} />
        <LpHowItWorks />
        <LpSituations />
        <LpTestimonials />
        <LpAbout />
        <LpForm />
        <LpFaq />
        <LpFooter />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
